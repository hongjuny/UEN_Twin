id: ai_training_campaign
title: "Weekday AI training campaign across campuses"
description: >
  Several universities train large models on the same weekday. Long elephant transfers run USU -> DDC,
  SUU -> DDC and U of U -> the research exit (Internet2), on top of normal daytime traffic, loading the northern
  chain and the southern 400G trunk. Demo message: the 400G core absorbs the large flows; the risk is at the
  edges and in compound events. SIMULATED; sizes are assumptions chosen for demonstration.
base_profile: weekday_semester
day: Tuesday
start: "06:00"
duration_hours: 14
seed: 42
confidence: assumed
overlays:
  - class: research_bulk
    label: "USU -> DDC training data"
    od: [usu-logan, slc-ddc]
    shape: {type: plateau, start: "08:00", end: "18:00", gbps: 40, ramp_min: 10}
  - class: research_bulk
    label: "SUU -> DDC training data"
    od: [suu-cedar, slc-ddc]
    shape: {type: plateau, start: "09:00", end: "16:00", gbps: 25, ramp_min: 10}
  - class: research_bulk
    label: "U of U -> Internet2 checkpoints"
    od: [slc-uofu, slc-level3]
    shape: {type: plateau, start: "10:00", end: "17:00", gbps: 60, ramp_min: 10}
  - class: research_bulk
    label: "Utah Tech -> DDC training data"
    od: [utahtech-stgeorge, slc-ddc]
    shape: {type: plateau, start: "11:00", end: "15:00", gbps: 15, ramp_min: 10}
events: []
