[project]
name = "uetn-twin"
version = "0.1.0"
description = "Flow-level digital twin of the UETN backbone with a monitoring dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "plotly>=5.24",
    "streamlit>=1.40",
    "simpy>=4.1",
]

[project.scripts]
uetn-twin = "uetn_twin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uetn_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
